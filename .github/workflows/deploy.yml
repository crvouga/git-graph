name: Deploy

# Continuous deployment: every green CI run on main ships to Fly.io.
# Does nothing until the FLY_API_TOKEN secret exists (fly tokens create deploy -c deploy/fly.toml).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://lanes-git-graph.fly.dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip when Fly.io is not configured
        id: gate
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN is not set; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: steps.gate.outputs.enabled == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: steps.gate.outputs.enabled == 'true'
        run: flyctl deploy -c deploy/fly.toml --dockerfile Dockerfile --remote-only .
