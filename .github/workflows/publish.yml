# Managed by OpenTofu github_repository_file.
name: Publish image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  lanes:
    uses: crvouga/personal/.github/workflows/publish.yml@main
    secrets:
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      CALLER_GITHUB_TOKEN: ${{ github.token }}
    with:
      service_id: lanes
      dockerfile: ./Dockerfile
      context: .
      image_owner: crvouga
      image_prefix: chrisvouga
      infra_github_repo: crvouga/personal

  gitty_storybook:
    uses: crvouga/personal/.github/workflows/publish.yml@main
    secrets:
      DEPLOY_DISPATCH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
      CALLER_GITHUB_TOKEN: ${{ github.token }}
    with:
      service_id: gitty-storybook
      dockerfile: ./Dockerfile.storybook
      context: .
      image_owner: crvouga
      image_prefix: chrisvouga
      infra_github_repo: crvouga/personal
